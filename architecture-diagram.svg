<svg viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc">
<title id="ttl">Advisor AI Fact Finder — MVP architecture</title>
<desc id="desc">Layered architecture: React SPA frontend, REST API, FastAPI routes, services, provider abstractions for LLM and transcription, repositories, and PostgreSQL. Shows the four-layer data flow from transcript to fact find contract with human review as a mandatory gate.</desc>

<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
</marker>
<marker id="arH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
</marker>
</defs>

<style>
.lbl { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: #1a1a1a; }
.sub { font: 400 10.5px ui-sans-serif, system-ui, sans-serif; fill: #6b6b6b; }
.tier { font: 600 10px ui-sans-serif, system-ui, sans-serif; fill: #8a8a8a; letter-spacing: .08em; }
.box { fill: #f6f6f4; stroke: #d8d8d4; stroke-width: 1; rx: 7; }
.boxA { fill: #eef4fb; stroke: #b6cfe8; stroke-width: 1; rx: 7; }
.boxH { fill: #fdf0e6; stroke: #e8b98f; stroke-width: 1.4; rx: 7; }
.ln { stroke: #b0b0ac; stroke-width: 1.3; fill: none; marker-end: url(#ar); }
.lnH { stroke: #c2410c; stroke-width: 1.7; fill: none; marker-end: url(#arH); }
.band { fill: none; stroke: #e2e2de; stroke-width: 1; stroke-dasharray: 3 3; rx: 10; }
.note { font: 400 10px ui-sans-serif, system-ui, sans-serif; fill: #c2410c; }
</style>

<rect width="900" height="1000" fill="#ffffff"/>

<!-- ============ FRONTEND ============ -->
<rect class="band" x="20" y="34" width="860" height="104"/>
<text class="tier" x="34" y="52">FRONTEND — React SPA (Vite, TypeScript)</text>

<rect class="box" x="40" y="62" width="150" height="56"/>
<text class="lbl" x="115" y="84" text-anchor="middle">Pages / Features</text>
<text class="sub" x="115" y="100" text-anchor="middle">clients · meetings</text>
<text class="sub" x="115" y="112" text-anchor="middle">factFind · review · audit</text>

<rect class="box" x="206" y="62" width="146" height="56"/>
<text class="lbl" x="279" y="84" text-anchor="middle">shadcn/ui</text>
<text class="sub" x="279" y="100" text-anchor="middle">Tailwind CSS</text>
<text class="sub" x="279" y="112" text-anchor="middle">stepper · badges · tabs</text>

<rect class="box" x="368" y="62" width="146" height="56"/>
<text class="lbl" x="441" y="84" text-anchor="middle">React Hook Form</text>
<text class="sub" x="441" y="100" text-anchor="middle">+ Zod schemas</text>
<text class="sub" x="441" y="112" text-anchor="middle">mirror Pydantic models</text>

<rect class="box" x="530" y="62" width="146" height="56"/>
<text class="lbl" x="603" y="84" text-anchor="middle">TanStack Query</text>
<text class="sub" x="603" y="100" text-anchor="middle">server state</text>
<text class="sub" x="603" y="112" text-anchor="middle">no scattered fetch</text>

<rect class="box" x="692" y="62" width="148" height="56"/>
<text class="lbl" x="766" y="84" text-anchor="middle">API Client Layer</text>
<text class="sub" x="766" y="100" text-anchor="middle">single typed</text>
<text class="sub" x="766" y="112" text-anchor="middle">gateway to REST</text>

<path class="ln" d="M 766 118 L 766 154"/>
<text class="sub" x="778" y="140">REST / JSON</text>

<!-- ============ API ============ -->
<rect class="band" x="20" y="160" width="860" height="86"/>
<text class="tier" x="34" y="178">API — FastAPI routes</text>

<rect class="box" x="40" y="188" width="188" height="44"/>
<text class="lbl" x="134" y="207" text-anchor="middle">/api/clients</text>
<text class="sub" x="134" y="222" text-anchor="middle">search · profile</text>

<rect class="box" x="244" y="188" width="188" height="44"/>
<text class="lbl" x="338" y="207" text-anchor="middle">/api/meetings</text>
<text class="sub" x="338" y="222" text-anchor="middle">transcript · transcribe · extract</text>

<rect class="box" x="448" y="188" width="188" height="44"/>
<text class="lbl" x="542" y="207" text-anchor="middle">/api/meetings/review</text>
<text class="sub" x="542" y="222" text-anchor="middle">accept · edit · reject</text>

<rect class="box" x="652" y="188" width="188" height="44"/>
<text class="lbl" x="746" y="207" text-anchor="middle">/api/fact-finds</text>
<text class="sub" x="746" y="222" text-anchor="middle">submit · get · audit</text>

<path class="ln" d="M 440 232 L 440 268"/>

<!-- ============ SERVICES ============ -->
<rect class="band" x="20" y="274" width="860" height="96"/>
<text class="tier" x="34" y="292">APPLICATION SERVICES — orchestration, no DB queries in routes</text>

<rect class="box" x="40" y="302" width="150" height="54"/>
<text class="lbl" x="115" y="324" text-anchor="middle">ClientService</text>
<text class="sub" x="115" y="340" text-anchor="middle">search · profile</text>

<rect class="box" x="206" y="302" width="150" height="54"/>
<text class="lbl" x="281" y="324" text-anchor="middle">MeetingService</text>
<text class="sub" x="281" y="340" text-anchor="middle">session · transcript</text>

<rect class="boxA" x="372" y="302" width="150" height="54"/>
<text class="lbl" x="447" y="324" text-anchor="middle">LLMExtraction</text>
<text class="sub" x="447" y="340" text-anchor="middle">transcript → facts</text>

<rect class="box" x="538" y="302" width="150" height="54"/>
<text class="lbl" x="613" y="324" text-anchor="middle">FactFindMapper</text>
<text class="sub" x="613" y="340" text-anchor="middle">extraction → contract</text>

<rect class="box" x="704" y="302" width="136" height="54"/>
<text class="lbl" x="772" y="324" text-anchor="middle">AuditService</text>
<text class="sub" x="772" y="340" text-anchor="middle">append-only</text>

<path class="ln" d="M 447 356 L 447 392"/>

<!-- ============ PROVIDERS ============ -->
<rect class="band" x="20" y="398" width="860" height="118"/>
<text class="tier" x="34" y="416">PROVIDER ABSTRACTIONS — swap via env config, business logic stays decoupled</text>

<rect class="boxA" x="60" y="428" width="176" height="72"/>
<text class="lbl" x="148" y="450" text-anchor="middle">LLMProvider</text>
<text class="sub" x="148" y="467" text-anchor="middle">OllamaProvider</text>
<text class="sub" x="148" y="480" text-anchor="middle">MockLLMProvider</text>
<text class="sub" x="148" y="493" text-anchor="middle">(OpenAI / Bedrock later)</text>

<rect class="boxA" x="252" y="428" width="176" height="72"/>
<text class="lbl" x="340" y="450" text-anchor="middle">TranscriptionProvider</text>
<text class="sub" x="340" y="467" text-anchor="middle">FasterWhisperProvider</text>
<text class="sub" x="340" y="480" text-anchor="middle">MockTranscription</text>
<text class="sub" x="340" y="493" text-anchor="middle">(diarization later)</text>

<rect class="boxH" x="470" y="428" width="200" height="72"/>
<text class="lbl" x="570" y="452" text-anchor="middle">Pydantic Validation</text>
<text class="sub" x="570" y="470" text-anchor="middle">every LLM output passes here</text>
<text class="note" x="570" y="487" text-anchor="middle">raw LLM JSON never reaches DB</text>

<rect class="box" x="686" y="428" width="154" height="72"/>
<text class="lbl" x="763" y="452" text-anchor="middle">Repositories</text>
<text class="sub" x="763" y="470" text-anchor="middle">SQLAlchemy</text>
<text class="sub" x="763" y="487" text-anchor="middle">Alembic migrations</text>

<path class="ln" d="M 148 500 L 148 528 L 560 528" />
<path class="ln" d="M 340 500 L 340 520 L 560 520" />
<path class="ln" d="M 570 500 L 570 512"/>
<path class="ln" d="M 763 500 L 763 560"/>

<!-- ============ DATA LAYERS ============ -->
<rect class="band" x="20" y="548" width="620" height="150"/>
<text class="tier" x="34" y="566">FOUR DATA LAYERS — never overwrite one with another</text>

<rect class="box" x="40" y="578" width="128" height="48"/>
<text class="lbl" x="104" y="598" text-anchor="middle">1. Transcript</text>
<text class="sub" x="104" y="614" text-anchor="middle">raw, immutable</text>

<rect class="boxA" x="188" y="578" width="128" height="48"/>
<text class="lbl" x="252" y="598" text-anchor="middle">2. AI Extraction</text>
<text class="sub" x="252" y="614" text-anchor="middle">+ evidence, confidence</text>

<rect class="boxH" x="336" y="578" width="140" height="48"/>
<text class="lbl" x="406" y="598" text-anchor="middle">3. Advisor Review</text>
<text class="sub" x="406" y="614" text-anchor="middle">accept · edit · reject</text>

<rect class="box" x="496" y="578" width="128" height="48"/>
<text class="lbl" x="560" y="598" text-anchor="middle">4. FactFind</text>
<text class="sub" x="560" y="614" text-anchor="middle">canonical contract</text>

<path class="ln" d="M 168 602 L 184 602"/>
<path class="lnH" d="M 316 602 L 332 602"/>
<path class="lnH" d="M 476 602 L 492 602"/>

<rect class="boxH" x="40" y="640" width="584" height="42"/>
<text class="lbl" x="332" y="659" text-anchor="middle">HUMAN REVIEW IS A MANDATORY GATE</text>
<text class="note" x="332" y="674" text-anchor="middle">AI never writes to the official client record without representative approval · original AI value always preserved alongside advisor edit</text>

<!-- ============ PERSISTENCE ============ -->
<rect class="band" x="656" y="548" width="224" height="150"/>
<text class="tier" x="670" y="566">PERSISTENCE</text>

<rect class="box" x="676" y="578" width="184" height="104"/>
<text class="lbl" x="768" y="600" text-anchor="middle">PostgreSQL</text>
<text class="sub" x="768" y="618" text-anchor="middle">clients · meetings · transcripts</text>
<text class="sub" x="768" y="632" text-anchor="middle">ai_extractions · advisor_reviews</text>
<text class="sub" x="768" y="646" text-anchor="middle">fact_finds · fact_find_versions</text>
<text class="sub" x="768" y="662" text-anchor="middle">audit_events (append-only)</text>
<text class="sub" x="768" y="676" text-anchor="middle">Docker Compose (local)</text>

<path class="ln" d="M 624 602 L 672 602"/>

